packages:
  - apps/*
  - packages/*

# pnpm 11 requires an explicit map when strict dependency build review is enabled.
# Prisma generates the database client and esbuild is required by the mini-program build.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

  # These polyfills are transitive dependencies and do not need install-time scripts here.
  core-js: false
  core-js-pure: false
