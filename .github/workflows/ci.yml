name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://heban:heban_dev_password@localhost:5432/heban?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heban
          POSTGRES_PASSWORD: heban_dev_password
          POSTGRES_DB: heban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heban -d heban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heban/api prisma:generate
      - run: pnpm --filter @heban/api prisma:deploy
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @heban/api build
      - run: pnpm --filter @heban/mini typecheck
      - run: pnpm --filter @heban/mini build:mp-weixin:check
